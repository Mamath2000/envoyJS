services:
  envoyjs:
    # Utilise le Dockerfile du repo
    build:
      context: .
    image: envoyjs:local
    container_name: envoyjs
    restart: unless-stopped

    # Le process cherche ./config.yaml dans le WORKDIR (/app)
    volumes:
      - ./config.yaml:/app/config.yaml:ro

    # Optionnel: si tu veux forcer un fuseau côté conteneur
    # (la logique utilise surtout `timezone.name` dans le YAML)
    environment:
      - TZ=Europe/Paris
      # Le niveau de log est pris ici en priorité sur config.yaml
      # Valeurs: silent|error|warn|info|debug
      - LOG_LEVEL=info

    # Notes réseau:
    # - Si ton `envoy.base_url` pointe vers `http://envoy.local`, ça dépend du DNS/mDNS.
    #   Dans Docker, le .local (mDNS) ne marche pas toujours. Le plus simple est
    #   de mettre l'IP de l'Envoy dans `envoy.base_url` (ex: http://192.168.1.50).
    # - Si besoin, tu peux aussi ajouter une entrée statique:
    # extra_hosts:
    #   - "envoy.local:192.168.1.50"

    # Pas d'exposition de ports: le service publie vers MQTT (sortant).


# --- Variante optionnelle: broker MQTT local ---
# Si tu n'as pas déjà un broker, dé-commente ceci + adapte `mqtt.host` à `mqtt` dans config.yaml
