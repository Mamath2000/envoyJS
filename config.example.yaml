# Example configuration for Envoy REST → MQTT service
# Copy to ./config.yaml (ou ./config/config.yaml) et ajuste.

envoy:
  serial: "123456789"
  base_url: "http://envoy.local"

http:
  timeout_ms: 1500

auth:
  owner_email: ""
  owner_password: ""

polling:
  interval_ms: 60000          # Normal polling interval (default 60s)

high_frequency:
  enabled: true
  interval_ms: 1000

mqtt:
  host: "mqtt.local"
  port: 1883
  username: "user"
  password: "pass"
  base_topic: "envoy"

sensors:
  pv_production:
    enabled: true
    topic: "envoy/pv_production_energy"
    name: "PV Production Energy"

  conso_net:
    enabled: true
    topic: "envoy/conso_net_energy"
    name: "Conso Nette Energy"
    
  tableau_elec:
    enabled: false
    topic: "zigbee2mqtt/charge_ve"
    power_field: "power"          # optionnel, ex: "payload.power" si JSON imbriqué
    index_field: "energy"         # optionnel, index cumulé (kWh ou Wh) du tableau externe
    index_unit: "kwh"             # "kwh", "wh" ou "auto" (recommandé: fixer explicitement)
    state_file: "data/tableau-elec-state.json"  # persistance de baseline/index entre redémarrages
    sign: 1                        # 1 ajoute au net, -1 soustrait

state:
  midnight_references_file: "data/midnight-references-state.json"  # persistance des references _00h/dernier rollover entre redémarrages

discovery:
  enabled: true

logging:
  level: info

timezone:
  name: "Europe/Paris"          # Utilisé pour le snapshot minuit

