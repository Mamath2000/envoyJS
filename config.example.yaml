# Example configuration for Envoy REST → MQTT service
# Copy to ./config.yaml (ou ./config/config.yaml) et ajuste.

envoy:
  serial: "123456789"
  base_url: "http://envoy.local"

http:
  timeout_ms: 1500

auth:
  owner_email: ""
  owner_password: ""

polling:
  interval_ms: 60000          # Normal polling interval (default 60s)

high_frequency:
  enabled: true
  interval_ms: 1000

mqtt:
  host: "mqtt.local"
  port: 1883
  username: "user"
  password: "pass"
  base_topic: "envoy"

sensors:
  pv_production:
    enabled: true
    topic: "envoy/pv_production_energy"
    name: "PV Production Energy"

  conso_net:
    enabled: true
    topic: "envoy/conso_net_energy"
    name: "Conso Nette Energy"
    
  general_meter:
    topic: "zigbee2mqtt/general"           # capteur bidirectionnel place sur le general
    power_field: "power"                   # puissance signee instantanee (W), positif = import
    voltage_field: "voltage"
    current_field: "current"
    import_index_field: "energy"           # index cumulé importé
    export_index_field: "produced_energy"  # index cumulé exporté/injecté ("to_grid")
    index_unit: "kwh"                      # "kwh", "wh" ou "auto"
    # Index brut releve UNE SEULE FOIS a l'installation physique du capteur
    # sur le general (en Wh) — jamais recapturé/mis a jour automatiquement.
    import_baseline_wh: 0
    export_baseline_wh: 0
    # prod/whLifetime (Envoy) au meme instant — usage interne uniquement
    # (eco/conso_all), n'affecte jamais le champ publié prod/whLifetime.
    prod_baseline_wh: 0

state:
  midnight_references_file: "data/midnight-references-state.json"  # persistance des references _00h/dernier rollover entre redémarrages

discovery:
  enabled: true

logging:
  level: info

timezone:
  name: "Europe/Paris"          # Utilisé pour le snapshot minuit

